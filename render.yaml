databases:
  - name: academe-fund-admin-db
    plan: free
    databaseName: academe_fund_admin
    user: academe_fund_admin

services:
  - type: web
    name: academe-fund-admin
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: academe-fund-admin-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: GOOGLE_SHEET_ID
        value: 18ECp7K3wqgNGNHn1NUwt-DT81w3x0QT9KQRUzbLFH7k
      - key: GOOGLE_SHEET_NAME
        value: תשובות
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GOOGLE_PRIVATE_KEY
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: NODE_VERSION
        value: 20.11.0
